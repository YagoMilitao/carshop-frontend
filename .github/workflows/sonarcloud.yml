name: SonarCloud

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: Lint, Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Organization and project key stay in repository variables
          # so the workflow can be reused across environments safely.
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            # Wait for the Quality Gate result and fail the CI job if it fails.
            -Dsonar.qualitygate.wait=true
