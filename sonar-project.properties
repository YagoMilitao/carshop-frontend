sonar.projectName=carshop-frontend
sonar.sourceEncoding=UTF-8

# Analyze application code from src and treat test files there explicitly.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Keep generated assets, build output and tool configs out of the analysis scope.
sonar.exclusions=dist/**,node_modules/**,coverage/**,public/**,**/*.config.js,**/*.config.ts,vite.config.ts
# Avoid coverage pressure on bootstrap files while the test baseline is still growing.
sonar.coverage.exclusions=src/main.tsx,src/**/*.d.ts
# SonarCloud will import coverage automatically once the CI starts producing lcov.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
